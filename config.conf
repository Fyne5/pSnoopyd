# Card mạng cần giám sát (BẮT BUỘC chỉ rõ, ví dụ: eth0, enp3s0). Không dùng "any".
Interface = ens35

# Bật promiscuous mode (hữu ích khi cắm vào cổng SPAN/mirror). yes/no
Promisc = yes

# Danh sách DHCP server hợp pháp, định dạng IP[MAC] ngăn cách bằng dấu ;
# Server chỉ hợp lệ khi KHỚP CẢ IP VÀ MAC.
AllowDHCP = 192.168.20.12[bc:24:11:38:c9:83];192.168.20.251[b4:b0:24:b9:79:20]

# LogShow = yes: in cảnh báo trực tiếp ra console
LogShow = yes

# LogFilePath rỗng thì tắt ghi file (không phụ thuộc LogShow)
LogFilePath = 

# Web GUI. Nên bind localhost vì GUI không có xác thực. Để rỗng để tắt.
WebGUi = 0.0.0.0:8888
